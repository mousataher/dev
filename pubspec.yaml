name: arabdic
description: قاموس أوفلاين بثلاث لغات بواجهة عربية (AR/EN/DE)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: assets/icon/icon-1024.png
  adaptive_icon_background: "#2360C0"
  adaptive_icon_foreground: assets/icon/icon-1024.png

flutter:
  uses-material-design: true
  assets:
    - assets/data_seed.json
